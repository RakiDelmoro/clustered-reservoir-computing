# CluSTAR: Clustered Spatio-Temporal Reservoir Computing
# Action Classification Configuration

data:
  img_size: 28
  img_channels: 1
  seq_length: 60
  canvas_size: 64
  digit_class_range: [0, 9]

  actions:
    moving: {v_range: [2, 6], rotation: false}
    spinning: {v_range: [0, 0.1], rotation: true, omega_range: [60, 180]}
    stationary: {v_range: [0, 0], rotation: false}

  train_samples: 50000
  val_samples: 10000
  test_samples: 10000

reservoir:
  encoder:
    spatial_dim: 512
    temporal_dim: 256
    output_dim: 768

  size: 1000
  num_clusters: 10
  neurons_per_cluster: 100

  cluster:
    within_prob: 0.3
    between_prob: 0.02
    rewiring_prob: 0.1

  timescales:
    - name: "fast"
      fraction: 0.3
      alpha_range: [0.2, 0.4]
      spectral_radius_range: [0.7, 0.85]
    - name: "medium"
      fraction: 0.4
      alpha_range: [0.5, 0.7]
      spectral_radius_range: [0.8, 0.95]
    - name: "slow"
      fraction: 0.3
      alpha_range: [0.8, 1.0]
      spectral_radius_range: [0.9, 0.99]

  input_scaling: 0.5
  bias_scaling: 0.1
  spectral_radius_global: 0.95
  activation: "mixed"

  layer2:
    size: 500
    num_clusters: 5
    cluster:
      within_prob: 0.3
      between_prob: 0.02
      rewiring_prob: 0.1

    timescales:
      - name: "fast"
        fraction: 0.5
        alpha_range: [0.7, 1.0]
        spectral_radius_range: [0.8, 0.95]
      - name: "medium"
        fraction: 0.3
        alpha_range: [0.5, 0.7]
        spectral_radius_range: [0.75, 0.9]
      - name: "slow"
        fraction: 0.2
        alpha_range: [0.3, 0.5]
        spectral_radius_range: [0.7, 0.85]

    input_scaling: 0.3
    bias_scaling: 0.1
    spectral_radius_global: 0.95
    activation: "mixed"

finetune:
  num_classes: 3
  ridge_lambda: 100.0
  batch_size: 64
  num_workers: 0

training:
  seed: 42
  device: "cuda"

visualization:
  enabled: true
  tsne_perplexity: 50
